schema_version: 1
run_name: stage4_sampling_phase_a_coarse

# Phase A evaluates evidence sources only. Context is deliberately disabled so
# its fixed grid cost cannot hide changes in local/top-hat evidence quality.
fixed:
  sample_stride: 2
  min_alpha: 1
  min_intensity: 1
  original_foreground_mode: nonzero

  # Fixed legacy/global teacher-independent evidence used by the Stage 4
  # percentile85_area100 exporter preset.
  global_texture:
    texture_style: threshold_alpha
    denoise: median
    denoise_ksize: 3
    threshold_mode: percentile
    percentile: 85.0
    open_ksize: 3
    close_ksize: 5
    morph_shape: ellipse
    min_component_area: 100
    white_foreground: false

  # Current combined_v2 evidence settings form the one-factor reference.
  sampling:
    sampling_mode: combined_v2
    include_context_grid: false
    context_grid_stride: 4
    context_grid_phase: origin
    enable_local_percentile: true
    local_window_size: 41
    local_percentile: 80.0
    local_min_contrast: 4.0
    enable_tophat: true
    tophat_kernel_size: 21
    tophat_percentile: 85.0
    tophat_min_response: 2.0
    tophat_morph_shape: ellipse
    enable_evidence_cleanup: true
    evidence_open_ksize: 3
    evidence_close_ksize: 5
    evidence_morph_shape: ellipse
    evidence_min_component_area: 100
    local_source_confidence: 0.7
    tophat_source_confidence: 0.7
    context_source_confidence: 0.0

evaluation:
  extent_min_elongation: 2.0

# This is a staged one-factor coarse search, not a Cartesian product. The
# duplicated reference values in one_factor are automatically de-duplicated by
# config hash, leaving one common reference across all stages.
stages:
  - name: a0_source_structure
    include_base: true
    configs:
      - name: global_only
        overrides:
          enable_local_percentile: false
          enable_tophat: false
      - name: global_plus_local
        overrides:
          enable_tophat: false
      - name: global_plus_tophat
        overrides:
          enable_local_percentile: false
      - name: local_tophat_without_cleanup
        overrides:
          enable_evidence_cleanup: false

  - name: a1_local_coarse
    one_factor:
      local_window_size: [21, 31, 41, 61]
      local_percentile: [70.0, 75.0, 80.0, 85.0, 90.0]
      local_min_contrast: [0.0, 4.0, 8.0, 12.0]

  - name: a2_tophat_coarse
    one_factor:
      tophat_kernel_size: [11, 21, 31, 41]
      tophat_percentile: [80.0, 85.0, 90.0, 95.0]
      tophat_min_response: [0.0, 2.0, 4.0, 8.0]

  - name: a3_cleanup_coarse
    one_factor:
      evidence_open_ksize: [0, 3, 5]
      evidence_close_ksize: [0, 3, 5]
      evidence_min_component_area: [0, 25, 50, 100, 200]

