schema_version: 1
run_name: stage4_sampling_foundation_smoke

fixed:
  sample_stride: 2
  min_alpha: 1
  min_intensity: 1
  original_foreground_mode: nonzero

  # Must remain identical to the Stage 4 percentile85_area100 exporter preset.
  global_texture:
    texture_style: threshold_alpha
    denoise: median
    denoise_ksize: 3
    threshold_mode: percentile
    percentile: 85.0
    open_ksize: 3
    close_ksize: 5
    morph_shape: ellipse
    min_component_area: 100
    white_foreground: false

  sampling:
    sampling_mode: combined_v2
    include_context_grid: true
    context_grid_stride: 4
    context_grid_phase: origin
    enable_local_percentile: true
    local_window_size: 41
    local_percentile: 80.0
    local_min_contrast: 4.0
    enable_tophat: true
    tophat_kernel_size: 21
    tophat_percentile: 85.0
    tophat_min_response: 2.0
    tophat_morph_shape: ellipse
    enable_evidence_cleanup: true
    evidence_open_ksize: 3
    evidence_close_ksize: 5
    evidence_morph_shape: ellipse
    evidence_min_component_area: 100
    local_source_confidence: 0.7
    tophat_source_confidence: 0.7
    context_source_confidence: 0.0

evaluation:
  extent_min_elongation: 2.0

stages:
  - name: smoke
    configs:
      - name: current_combined_v2
        overrides: {}
      - name: without_context
        overrides:
          include_context_grid: false
      - name: without_local
        overrides:
          enable_local_percentile: false
      - name: without_tophat
        overrides:
          enable_tophat: false
      - name: without_evidence_cleanup
        overrides:
          enable_evidence_cleanup: false

